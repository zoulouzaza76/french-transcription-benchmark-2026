<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="infographie-cse-title infographie-cse-desc" xml:lang="fr">
  <title id="infographie-cse-title">Référentiel 2026 — Procès-Verbal de CSE, Enregistrement Audio, Temps de Rédaction et AI Act</title>
  <desc id="infographie-cse-desc">Synthèse visuelle en 4 blocs pour les Secrétaires de CSE, CSSCT, élus et DRH : 1) Délai légal supplétif de 15 jours (art. R. 2315-25 du Code du travail) et signature exclusive du Secrétaire du CSE (art. L. 2315-34) ; 2) Enregistrement audio de droit sur décision du CSE ou de l'employeur (art. D. 2315-27), suspension sur informations confidentielles et purge RGPD après approbation ; 3) Temps réel de rédaction pour 1 heure de séance : 4 à 7 heures en frappe manuelle au casque contre 2 à 3 heures en réécoute intégrale sur fichier Word .docx 100 % modifiable après pré-transcription IA en 2 passes (temps divisé par 2), ou double relecture humaine à 60 € HT/h par deux transcripteurs successifs ; 4) Règlement européen AI Act (août 2026) interdisant l'inférence émotionnelle vocale au travail (art. 5) et architecture RGPD avec stockage en France chez OVHcloud (AES-256) et inférence via Google Cloud Vertex AI en région Europe (Zero Data Retention). Source ouverte CC-BY-4.0 LE SCRIBE AUDIO (lescribeaudio.com · +33 9 61 44 46 64).</desc>

  <defs>
    <style>
      .font-ui {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .card-shadow {
        filter: drop-shadow(0 4px 12px rgba(15, 23, 42, 0.06));
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1200" height="675" fill="#f1f5f9" />

  <!-- Top Header Banner (Slate #0f172a) -->
  <rect x="0" y="0" width="1200" height="106" fill="#0f172a" />
  <rect x="0" y="103" width="1200" height="3" fill="#4f46e5" />

  <!-- Header Badge -->
  <rect x="40" y="16" width="336" height="24" rx="12" fill="#4f46e5" />
  <text x="208" y="32" text-anchor="middle" class="font-ui" font-size="11" font-weight="700" letter-spacing="0.6" fill="#ffffff">RÉFÉRENTIEL JURIDIQUE &amp; OPÉRATIONNEL 2026</text>

  <!-- Header Title & Subtitle -->
  <text x="40" y="66" class="font-ui" font-size="24" font-weight="800" fill="#ffffff">Procès-Verbal de CSE : Délais, Enregistrement Audio &amp; AI Act 2026</text>
  <text x="40" y="90" class="font-ui" font-size="13.5" font-weight="400" fill="#cbd5e1">Cadre Code du travail, RGPD &amp; Règlement (UE) 2024/1689 — Temps réels de rédaction et conformité des outils</text>

  <!-- Header Right Summary Pill -->
  <rect x="976" y="22" width="184" height="62" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="1068" y="46" text-anchor="middle" class="font-ui" font-size="12" font-weight="700" fill="#fbbf24">ÉDITION AOÛT 2026</text>
  <text x="1068" y="64" text-anchor="middle" class="font-ui" font-size="11.5" font-weight="600" fill="#e2e8f0">CSE · CSSCT · RH</text>
  <text x="1068" y="78" text-anchor="middle" class="font-ui" font-size="10" font-weight="500" fill="#94a3b8">Licence ouverte CC-BY-4.0</text>

  <!-- ======================================================================= -->
  <!-- CARD 1 (Top-Left): Délai Légal & Signature (Indigo #4f46e5)             -->
  <!-- ======================================================================= -->
  <g class="card-shadow">
    <rect x="40" y="122" width="550" height="236" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="40" y="122" width="8" height="236" rx="4" fill="#4f46e5" />
  </g>

  <!-- Card 1 Header -->
  <circle cx="72" cy="152" r="14" fill="#eef2ff" />
  <text x="72" y="157" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#4f46e5">1</text>
  <text x="96" y="157" class="font-ui" font-size="16" font-weight="800" fill="#0f172a">Délai Légal &amp; Signature du PV</text>

  <!-- Card 1 KPI Badge -->
  <rect x="444" y="135" width="128" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="508" y="156" text-anchor="middle" class="font-ui" font-size="14" font-weight="800" fill="#4338ca">15 JOURS</text>

  <line x1="64" y1="178" x2="572" y2="178" stroke="#e2e8f0" stroke-width="1" />

  <!-- Card 1 Content -->
  <circle cx="70" cy="202" r="4" fill="#4f46e5" />
  <text x="84" y="206" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">Délai supplétif de 15 jours (art. R. 2315-25 C. trav.)</text>
  <text x="84" y="224" class="font-ui" font-size="12" fill="#334155">Ramené à 3 jours si une nouvelle réunion précède, ou 1 jour en cas</text>
  <text x="84" y="240" class="font-ui" font-size="12" fill="#334155">de redressement ou liquidation judiciaire (sauf accord d'entreprise).</text>

  <circle cx="70" cy="266" r="4" fill="#4f46e5" />
  <text x="84" y="270" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">Signature exclusive du Secrétaire du CSE (art. L. 2315-34)</text>
  <text x="84" y="288" class="font-ui" font-size="12" fill="#334155">Seul le Secrétaire établit et signe le procès-verbal ; l'employeur ne</text>
  <text x="84" y="304" class="font-ui" font-size="12" fill="#334155">peut ni imposer une co-signature ni censurer un échange avant vote.</text>

  <rect x="64" y="318" width="508" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="76" y="336" class="font-ui" font-size="11.5" font-weight="600" fill="#475569">Diffusion &amp; affichage autorisés après adoption en séance suivante (art. L. 2315-35).</text>

  <!-- ======================================================================= -->
  <!-- CARD 2 (Top-Right): Enregistrement Audio (Emerald #059669)              -->
  <!-- ======================================================================= -->
  <g class="card-shadow">
    <rect x="610" y="122" width="550" height="236" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="610" y="122" width="8" height="236" rx="4" fill="#059669" />
  </g>

  <!-- Card 2 Header -->
  <circle cx="642" cy="152" r="14" fill="#ecfdf5" />
  <text x="642" y="157" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#059669">2</text>
  <text x="666" y="157" class="font-ui" font-size="16" font-weight="800" fill="#0f172a">Enregistrement Audio (Art. D. 2315-27)</text>

  <!-- Card 2 KPI Badge -->
  <rect x="1006" y="135" width="136" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="1074" y="156" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#047857">DROIT DU CSE</text>

  <line x1="634" y1="178" x2="1142" y2="178" stroke="#e2e8f0" stroke-width="1" />

  <!-- Card 2 Content -->
  <circle cx="640" cy="202" r="4" fill="#059669" />
  <text x="654" y="206" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">Décision du CSE (majorité des présents) ou de l'employeur</text>
  <text x="654" y="224" class="font-ui" font-size="12" fill="#334155">L'employeur ne peut pas interdire l'enregistrement voté par les élus</text>
  <text x="654" y="240" class="font-ui" font-size="12" fill="#334155">(refus injustifié constitutif d'un délit d'entrave — art. L. 2317-1).</text>

  <circle cx="640" cy="266" r="4" fill="#059669" />
  <text x="654" y="270" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">Suspension sur informations confidentielles (art. L. 2315-3)</text>
  <text x="654" y="288" class="font-ui" font-size="12" fill="#334155">Interruption ponctuelle sur demande motivée lorsque des données</text>
  <text x="654" y="304" class="font-ui" font-size="12" fill="#334155">stratégiques objectivement confidentielles sont présentées en séance.</text>

  <rect x="634" y="318" width="508" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="646" y="336" class="font-ui" font-size="11.5" font-weight="600" fill="#065f46">Purge RGPD (art. 5.1.e) : suppression de l'audio dès l'approbation officielle du PV.</text>

  <!-- ======================================================================= -->
  <!-- CARD 3 (Bottom-Left): Temps Réel de Rédaction (Amber #d97706)           -->
  <!-- ======================================================================= -->
  <g class="card-shadow">
    <rect x="40" y="376" width="550" height="236" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="40" y="376" width="8" height="236" rx="4" fill="#d97706" />
  </g>

  <!-- Card 3 Header -->
  <circle cx="72" cy="406" r="14" fill="#fffbeb" />
  <text x="72" y="411" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#d97706">3</text>
  <text x="96" y="411" class="font-ui" font-size="16" font-weight="800" fill="#0f172a">Temps Réel de Rédaction (1 h de séance)</text>

  <!-- Card 3 KPI Badge -->
  <rect x="444" y="389" width="128" height="34" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="508" y="410" text-anchor="middle" class="font-ui" font-size="14" font-weight="800" fill="#b45309">TEMPS ÷ 2</text>

  <line x1="64" y1="432" x2="572" y2="432" stroke="#e2e8f0" stroke-width="1" />

  <!-- Bar 1: Manual Typing -->
  <text x="64" y="454" class="font-ui" font-size="12" font-weight="700" fill="#334155">Frappe manuelle complète au casque (sans pré-transcription)</text>
  <rect x="64" y="461" width="380" height="22" rx="5" fill="#64748b" />
  <text x="74" y="476" class="font-ui" font-size="11.5" font-weight="700" fill="#ffffff">4 à 7 heures de travail humain</text>
  <text x="454" y="476" class="font-ui" font-size="11.5" font-weight="600" fill="#475569">par heure d'audio</text>

  <!-- Bar 2: 2-Pass AI + Ear-Checked Review -->
  <text x="64" y="503" class="font-ui" font-size="12" font-weight="700" fill="#0f172a">Pré-transcription IA 2 passes + réécoute intégrale (Word .docx 100 % modifiable)</text>
  <rect x="64" y="510" width="190" height="22" rx="5" fill="#4f46e5" />
  <text x="74" y="525" class="font-ui" font-size="11.5" font-weight="700" fill="#ffffff">2 à 3 heures</text>
  <text x="264" y="525" class="font-ui" font-size="11.5" font-weight="700" fill="#4f46e5">Temps de rédaction divisé par 2 (-50 %)</text>

  <!-- Option Double Human Proofreading Box -->
  <rect x="64" y="546" width="508" height="52" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="76" y="566" class="font-ui" font-size="12" font-weight="700" fill="#92400e">Option Relecture Humaine : 60 € HT / h (1,00 € HT / min)</text>
  <text x="76" y="585" class="font-ui" font-size="11.5" fill="#78350f">Réécoute intégrale par deux transcripteurs successifs · Finançable budget AEP 0,2 %</text>

  <!-- ======================================================================= -->
  <!-- CARD 4 (Bottom-Right): AI Act (Août 2026) & RGPD (Slate / Indigo)       -->
  <!-- ======================================================================= -->
  <g class="card-shadow">
    <rect x="610" y="376" width="550" height="236" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="610" y="376" width="8" height="236" rx="4" fill="#0f172a" />
  </g>

  <!-- Card 4 Header -->
  <circle cx="642" cy="406" r="14" fill="#f1f5f9" />
  <text x="642" y="411" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#0f172a">4</text>
  <text x="666" y="411" class="font-ui" font-size="16" font-weight="800" fill="#0f172a">AI Act (Août 2026) &amp; Sécurité RGPD</text>

  <!-- Card 4 KPI Badge -->
  <rect x="1006" y="389" width="136" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="1074" y="410" text-anchor="middle" class="font-ui" font-size="13" font-weight="800" fill="#b91c1c">ART. 5 AI ACT</text>

  <line x1="634" y1="432" x2="1142" y2="432" stroke="#e2e8f0" stroke-width="1" />

  <!-- Card 4 Content -->
  <circle cx="640" cy="456" r="4" fill="#dc2626" />
  <text x="654" y="460" class="font-ui" font-size="13" font-weight="700" fill="#991b1b">Interdiction de l'inférence émotionnelle vocale au travail</text>
  <text x="654" y="478" class="font-ui" font-size="12" fill="#334155">Art. 5 §1 f du Règlement (UE) 2024/1689 : interdiction stricte des outils</text>
  <text x="654" y="494" class="font-ui" font-size="12" fill="#334155">évaluant le stress, l'humeur ou le ton des élus et salariés (35 M€ / 7 % CA).</text>

  <circle cx="640" cy="520" r="4" fill="#4f46e5" />
  <text x="654" y="524" class="font-ui" font-size="13" font-weight="700" fill="#0f172a">Stockage France OVHcloud (AES-256) &amp; Inférence Europe</text>
  <text x="654" y="542" class="font-ui" font-size="12" fill="#334155">Inférence via Google Cloud Vertex AI (en région Europe) sans conservation</text>
  <text x="654" y="558" class="font-ui" font-size="12" fill="#334155">ni entraînement sur vos données (Zero Data Retention).</text>

  <rect x="634" y="570" width="508" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="646" y="588" class="font-ui" font-size="11.5" font-weight="600" fill="#3730a3">Suppression immédiate en 1 clic · Codage des intervenants (diarisation) avant export.</text>

  <!-- ======================================================================= -->
  <!-- Footer Bar (Slate #0f172a)                                              -->
  <!-- ======================================================================= -->
  <rect x="0" y="627" width="1200" height="48" fill="#0f172a" />
